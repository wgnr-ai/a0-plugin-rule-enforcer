name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test deps
        run: pip install pyyaml
      - name: Compile check
        run: |
          python -m py_compile helpers/rule_engine.py
          python -m py_compile extensions/python/tool_execute_before/_10_rule_validator.py
      - name: Config validity
        run: python -c "import yaml; yaml.safe_load(open('default_config.yaml'))"
      - name: Test suite
        run: python tests/test_rule_engine.py -v
